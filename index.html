```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CASA — Cortometraje</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

#movie{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#050505;
}

/* =========================
   HABITACIÓN
========================= */

.room{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.95) 0%,
            rgba(20,20,20,.5) 45%,
            rgba(0,0,0,.95) 100%
        ),
        radial-gradient(
            circle at 50% 40%,
            #343434 0%,
            #151515 45%,
            #020202 100%
        );
}

/* Ventana */

.window{
    position:absolute;
    width:23vw;
    height:36vh;
    min-width:180px;
    min-height:220px;
    right:14%;
    top:16%;
    background:
        linear-gradient(
            rgba(40,60,70,.3),
            rgba(0,0,0,.7)
        );
    border:7px solid #111;
    box-shadow:0 0 30px #000;
}

.window:before{
    content:"";
    position:absolute;
    width:4px;
    height:100%;
    background:#111;
    left:50%;
}

.window:after{
    content:"";
    position:absolute;
    width:100%;
    height:4px;
    background:#111;
    top:50%;
}

/* Escritorio */

.desk{
    position:absolute;
    width:48vw;
    height:10vh;
    bottom:13%;
    left:25%;
    background:
        linear-gradient(#262626,#111);
    box-shadow:0 20px 30px rgba(0,0,0,.8);
}

.desk:before,
.desk:after{
    content:"";
    position:absolute;
    width:5%;
    height:180%;
    background:#111;
    top:70%;
}

.desk:before{
    left:8%;
}

.desk:after{
    right:8%;
}

/* Monitor */

.monitor{
    position:absolute;
    width:24vw;
    height:20vh;
    min-width:200px;
    min-height:130px;
    bottom:23%;
    left:37%;
    background:#030303;
    border:8px solid #111;
    box-shadow:
        0 0 20px rgba(100,120,140,.15),
        inset 0 0 40px #000;
}

.monitor-screen{
    position:absolute;
    inset:8px;
    background:
        radial-gradient(
            circle,
            rgba(70,90,100,.25),
            #020202 70%
        );
}

/* =========================
   FIGURA
========================= */

.figure{
    position:absolute;
    width:65px;
    height:190px;
    right:24%;
    top:25%;
    opacity:0;
    transition:opacity .1s;
    filter:blur(1px);
}

.figure .head{
    position:absolute;
    width:55px;
    height:65px;
    border-radius:50%;
    background:#050505;
    left:5px;
    top:0;
    box-shadow:0 0 25px rgba(0,0,0,.9);
}

.figure .body{
    position:absolute;
    width:65px;
    height:130px;
    background:#030303;
    top:55px;
    border-radius:25px 25px 5px 5px;
}

.figure .eyes{
    position:absolute;
    z-index:2;
    top:28px;
    left:15px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ddd;
    box-shadow:27px 0 0 #ddd;
    opacity:.7;
}

/* =========================
   LINTERNA
========================= */

.flashlight{
    position:absolute;
    width:65vw;
    height:65vw;
    max-width:850px;
    max-height:850px;
    border-radius:50%;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,220,.17) 0%,
            rgba(255,255,220,.08) 15%,
            rgba(0,0,0,0) 55%
        );

    transform:translate(-50%,-50%);
    left:50%;
    top:50%;
}

/* =========================
   LLUVIA
========================= */

.rain{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.35;
    background-image:
        repeating-linear-gradient(
            105deg,
            transparent 0px,
            transparent 8px,
            rgba(255,255,255,.08) 9px,
            transparent 10px
        );
    animation:rainMove .25s linear infinite;
}

@keyframes rainMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:-30px 80px;
    }
}

/* =========================
   RUIDO DE CÁMARA
========================= */

.noise{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 3px
        );
    background-size:5px 5px;
    mix-blend-mode:screen;
}

/* Líneas de cámara */

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 4px
        );
}

/* Viñeta */

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse,
            transparent 45%,
            rgba(0,0,0,.85) 100%
        );
}

/* =========================
   TEXTO
========================= */

#subtitle{
    position:absolute;
    bottom:8%;
    width:100%;
    text-align:center;
    color:#ddd;
    font-size:18px;
    letter-spacing:2px;
    text-shadow:0 2px 5px #000;
    opacity:0;
    transition:opacity .5s;
}

#time{
    position:absolute;
    top:25px;
    right:30px;
    color:#bbb;
    font-family:monospace;
    font-size:14px;
    opacity:.6;
}

/* REC */

#rec{
    position:absolute;
    top:25px;
    left:30px;
    color:#eee;
    font-family:monospace;
    font-size:14px;
}

#dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#d22;
    border-radius:50%;
    margin-right:7px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:.2;
    }
}

/* =========================
   PANTALLA INICIAL
========================= */

#start{
    position:absolute;
    inset:0;
    z-index:100;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:#ddd;
}

#start h1{
    font-size:clamp(35px,7vw,90px);
    letter-spacing:15px;
    font-weight:300;
}

#start p{
    margin-top:20px;
    color:#777;
    letter-spacing:4px;
}

#start button{
    margin-top:50px;
    padding:15px 40px;
    background:transparent;
    border:1px solid #555;
    color:#ddd;
    cursor:pointer;
    letter-spacing:4px;
}

#start button:hover{
    background:#111;
}

/* =========================
   TEMBLOR
========================= */

.shake{
    animation:cameraShake .12s infinite;
}

@keyframes cameraShake{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(2px,-1px);}
    75%{transform:translate(-1px,-2px);}
    100%{transform:translate(1px,2px);}
}

/* Flash */

.flash{
    animation:flash .15s;
}

@keyframes flash{
    0%{filter:brightness(1);}
    30%{filter:brightness(4);}
    100%{filter:brightness(1);}
}

/* Pantalla negra */

#black{
    position:absolute;
    inset:0;
    background:#000;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s;
}
</style>
</head>

<body>

<div id="movie">

    <div class="room" id="room">

        <div class="window"></div>

        <div class="desk"></div>

        <div class="monitor">
            <div class="monitor-screen"></div>
        </div>

        <div class="figure" id="figure">
            <div class="head"></div>
            <div class="eyes"></div>
            <div class="body"></div>
        </div>

    </div>

    <div class="flashlight" id="flashlight"></div>

    <div class="rain"></div>

    <div class="noise"></div>

    <div class="scanlines"></div>

    <div class="vignette"></div>

    <div id="rec">
        <span id="dot"></span>REC
    </div>

    <div id="time">
        02:13:47
    </div>

    <div id="subtitle"></div>

    <div id="black"></div>

    <div id="start">
        <h1>LA CASA</h1>
        <p>UNA GRABACIÓN ENCONTRADA</p>
        <button onclick="startMovie()">COMENZAR</button>
    </div>

</div>

<script>

let movieStarted = false;

const figure = document.getElementById("figure");
const subtitle = document.getElementById("subtitle");
const black = document.getElementById("black");
const room = document.getElementById("room");
const flashlight = document.getElementById("flashlight");

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

function text(message,time=2500){

    subtitle.innerText = message;
    subtitle.style.opacity = "1";

    setTimeout(()=>{
        subtitle.style.opacity = "0";
    },time);
}

async function startMovie(){

    if(movieStarted) return;

    movieStarted=true;

    document.getElementById("start").style.display="none";

    // Movimiento de cámara
    movie.classList.add("shake");

    text("02:13 AM",2500);

    await sleep(4000);

    // Primer ruido
    text("¿Qué fue eso?",2200);

    await sleep(3500);

    // La cámara se mueve
    flashlight.style.left="35%";
    flashlight.style.top="48%";

    await sleep(2500);

    // Todo se oscurece
    black.style.opacity=".75";

    await sleep(1000);

    black.style.opacity="0";

    await sleep(2500);

    // Figura aparece muy brevemente
    figure.style.opacity="1";

    await sleep(500);

    figure.style.opacity="0";

    await sleep(2500);

    text("No estoy solo.",2500);

    await sleep(3500);

    // Cámara comienza a temblar más
    movie.classList.remove("shake");

    room.classList.add("shake");

    flashlight.style.left="70%";
    flashlight.style.top="40%";

    await sleep(1500);

    // La figura aparece nuevamente
    figure.style.opacity="1";

    await sleep(900);

    // Flash de cámara
    movie.classList.add("flash");

    await sleep(200);

    movie.classList.remove("flash");

    await sleep(500);

    // Oscuridad
    black.style.transition="opacity .2s";
    black.style.opacity="1";

    await sleep(2500);

    subtitle.style.opacity="1";
    subtitle.innerText="FIN DE LA GRABACIÓN";

    await sleep(4000);

    subtitle.innerText="";

}

document.addEventListener("mousemove",(e)=>{

    if(!movieStarted) return;

    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;

    flashlight.style.left=x+"%";
    flashlight.style.top=y+"%";

});

</script>

</body>
</html>
